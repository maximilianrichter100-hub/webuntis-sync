name: Sync WebUntis Timetable

on:
  schedule:
    # Läuft automatisch 3x am Tag (Morgens, Mittags, Abends)
    - cron: '0 5,11,17 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bibliotheken installieren
        run: |
          pip install --upgrade pip
          pip install requests icalendar

      - name: Stundenplan abrufen & ICS generieren
        run: python untis_sync.py

      - name: Kalenderdatei committen & pushen
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add dpm1_wiese.ics

          if git diff --staged --quiet; then
            echo "Keine Änderungen am Stundenplan."
          else
            git commit -m "Auto-Sync: Stundenplan DPM_1 (WiSe) aktualisiert"
            git pull --rebase origin main
            git push origin main
          fi
