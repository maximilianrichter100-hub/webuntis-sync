name: Sync WebUntis Timetable

on:
  schedule:
    - cron: '0 5,11,17 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bibliotheken installieren
        run: |
          pip install --upgrade pip
          pip install requests icalendar

      - name: Neuesten Stand vom Repo holen
        run: git pull origin main

      - name: Stundenplan abrufen & ICS generieren
        run: python untis_sync.py

      - name: Kalenderdatei committen & pushen
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add dpm1_wiese.ics

          if git diff --staged --quiet; then
            echo "Keine Änderungen am Stundenplan."
          else
            git commit -m "Auto-Sync: Stundenplan DPM_1 (WiSe) aktualisiert"
            git push --force origin main
          fi
